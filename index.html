<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabMaker — Tour 360°</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <a-scene
    id="mainScene"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .interativo; enabled: true">
    <a-sky id="mainSky" src="assets/panoramas/01-antesala-recepcao.png"></a-sky>
    <a-camera>
      <a-cursor
        id="vrCursor"
        cursor="rayOrigin: entity; fuse: true; fuseTimeout: 1200"
        raycaster="objects: .interativo; enabled: false"
        visible="false">
      </a-cursor>
    </a-camera>
    <a-entity id="hotspotRoot"></a-entity>
    <a-entity id="vrPanelRoot" visible="false"></a-entity>
  </a-scene>
  
  <!-- Canvas oculto para renderização do painel VR -->
  <canvas id="vrPanelCanvas" width="1024" height="640" hidden></canvas>

  <div id="painelRecurso">
    <div id="recursoConteudo">
      <h3 id="recursoTitulo"></h3>
      <img id="recursoImagem" alt="" />
      <p id="recursoDescricao"></p>
      <div id="recursoAcoes"></div>
      <button id="btnFecharRecurso">Fechar</button>
    </div>
  </div>

  <div id="painel">
    <span id="nomeCena">Antesala / Recepção</span>
    <p id="descricaoCena"></p>
  </div>

  <button id="btnPercurso">Percurso</button>

  <div id="painelPercurso">
    <div id="percursoConteudo">
      <h3 id="percursoTitulo"></h3>
      <p id="percursoDescricao"></p>
      <p id="percursoProgresso"></p>
      <div id="percursoBotoes">
        <button id="btnAnterior">Anterior</button>
        <button id="btnProxima">Próxima</button>
      </div>
      <button id="btnFecharPercurso">Fechar</button>
    </div>
  </div>

  <script src="src/scenes.js"></script>
  <script src="src/steps.js"></script>
  <script src="src/vr-panel.js?v=0.6.4"></script>
  <script src="src/ui.js?v=0.6.4"></script>
  <script src="src/hotspots.js"></script>
  <script src="src/tag-types/label.js"></script>
  <script src="src/tag-types/media.js"></script>
  <script src="src/mode.js?v=0.6.4"></script>
  <script src="src/tags.js"></script>
  <script src="src/main.js?v=0.6.4"></script>
</body>
</html>
